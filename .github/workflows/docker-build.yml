name: Docker Scan

on: 
    workflow_call:

jobs:
    docker-file-lint-and-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folders: ['Frontend']
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: ${{ matrix.folders}} Dockerfile Lint
              uses: hadolint/hadolint-action@v3.5.0
              with:
                dockerfile: ${{ matrix.folders}}/dockerfile

            - name: Docker Hardened Images [Login]
              uses: docker/login-action@v4
              with:
                registry: dhi.io
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
                logout: true

            - name: Docker Build ${{ matrix.folders}}
              run: docker build -t devboard-${{ matrix.folders }}:ci .
              working-directory: ${{ matrix.folders}}
