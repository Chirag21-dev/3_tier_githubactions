name: Dependency scan

on:
    workflow_call:

jobs:
    dependency-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Code Checkout
              uses: actions/checkout@v7

            - name: Make reports dir
              run: mkdir -p reports

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: '20'
                cache: npm
                cache-dependency-path: Frontend/package-lock.json

            - name: npm audit
              continue-on-error: true
              run: (cd frontend && npm audit) | tee reports/frontend-npm-audit.txt

            - name: Upload Reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: dependency-scan-report
                path: reports/
                retention-days: 5
