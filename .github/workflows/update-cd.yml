
name: Update GitOps Repository

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string

    secrets:
      CD_REPO_TOKEN:
        required: true

jobs:
  update-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: Chirag21-dev/3tier-githubactions-cd
          ref: main
          token: ${{ secrets.CD_REPO_TOKEN }}

      - name: Update deployment image
        run: |
          sed -i \
            "s|image: chiragks1/devboard-frontend:.*|image: chiragks1/devboard-frontend:${{ inputs.image_tag }}|" \
            manifests/deployment.yaml

      - name: Verify image update
        run: |
          grep "image:" manifests/deployment.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add manifests/deployment.yaml

          git commit -m "Update webapp image to ${{ inputs.image_tag }}" || exit 0

          git push origin main
